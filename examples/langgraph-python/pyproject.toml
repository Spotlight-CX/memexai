[project]
name = "memexai-langgraph-python-example"
version = "0.1.0"
description = "Terminal LangGraph Python example for MemexAI service mode"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-google-genai>=4.0,<5",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
